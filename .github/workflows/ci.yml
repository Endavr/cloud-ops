name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore CloudOps.ServiceHub.slnx

      - name: Build
        run: dotnet build CloudOps.ServiceHub.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test CloudOps.ServiceHub.slnx --configuration Release --no-build --logger "console;verbosity=normal"
